<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>하라구리 단축어 연결</title><style>body{font:18px system-ui;max-width:440px;margin:60px auto;padding:24px;background:#f7f6f2;color:#243e32}a{display:block;padding:18px;background:#3f6e58;color:white;border-radius:12px;text-align:center;text-decoration:none}small{display:block;margin:20px 0}</style><h1>하라구리 단축어 연결</h1><p id="status">연결 버튼을 확인하고 있어요.</p><a id="run" hidden>단축어로 계정 연결</a><small>허용 질문이 나오면 허용해 주세요. 연결 코드는 5분 동안 한 번 사용할 수 있어요.</small><script>
const params=new URLSearchParams(location.hash.slice(1));const code=params.get('code');history.replaceState(null,'',location.pathname);const button=document.getElementById('run');
if(/^[0-9a-f]{48}$/.test(code||'')){button.href='shortcuts://run-shortcut?name='+encodeURIComponent('하라구리 알림 수집'.normalize('NFD'))+'&input=text&text='+code;button.hidden=false;document.getElementById('status').textContent='아래 버튼을 눌러 아이폰 단축어에 연결 코드를 전달해 주세요.';}else{document.getElementById('status').textContent='가족 설정에서 새 연결 버튼을 받아 주세요.';}
</script></html>
