<!doctype html><html lang="ko"><body style="margin:0;background:#f7f6f2;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#283b35">
<div style="max-width:480px;margin:0 auto;padding:36px 24px">
  <p style="font-size:22px;letter-spacing:2px;font-weight:700;color:#3e6958;margin:0 0 18px">HARAGURI</p>
  <h1 style="font-size:20px;margin:0 0 10px">로그인 인증번호</h1>
  <p style="font-size:14px;line-height:1.7;margin:0 0 16px">앱의 인증번호 칸에 아래 숫자를 입력하세요. 1시간 동안 유효해요.</p>
  <p style="font-size:34px;letter-spacing:6px;font-weight:700;background:#fff;border:1px solid #e9ebe5;border-radius:14px;padding:18px;text-align:center;margin:0 0 20px">{{ .Token }}</p>
  <p style="font-size:14px;line-height:1.7;margin:0 0 8px">같은 기기에서 열었다면 아래 버튼으로 바로 들어갈 수도 있어요.</p>
  <p style="margin:0 0 28px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#3e6958;color:#fff;text-decoration:none;border-radius:10px;padding:12px 18px;font-size:14px">HARAGURI 열기</a></p>
  <p style="font-size:12px;color:#7d857f;line-height:1.7;margin:0">본인이 요청하지 않았다면 이 메일은 무시하세요. 번호를 다른 사람에게 알려주지 마세요.</p>
</div></body></html>
