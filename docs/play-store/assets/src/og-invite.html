<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>잇닿 근무 초대 링크 미리보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  /* 카카오톡 링크 미리보기 1200×630 — 설치 링크(파랑)와 구분되게 흰 바탕 + 파랑 하나. 글자는 가운데 800×400 안에만 */
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; background: #FFFFFF; color: #191F28;
    font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif;
    -webkit-font-smoothing: antialiased; word-break: keep-all;
  }
  .safe { position: absolute; left: 200px; top: 115px; width: 800px; height: 400px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .badge { width: 104px; height: 104px; border-radius: 32px; background: #EBF3FF; display: flex; align-items: center; justify-content: center; }
  h1 { margin: 30px 0 0; font-weight: 800; font-size: 88px; line-height: 1.1; letter-spacing: -3px; white-space: nowrap; }
  h1 em { font-style: normal; color: #1B64DA; }
  p { margin: 22px 0 0; font-weight: 600; font-size: 36px; line-height: 1.3; letter-spacing: -1px; color: #4E5968; white-space: nowrap; }
  .brand { position: absolute; left: 0; right: 0; bottom: 36px; display: flex; justify-content: center; align-items: center; gap: 10px;
    font-weight: 800; font-size: 24px; color: #191F28; letter-spacing: -0.5px; }
</style>
</head>
<body>
  <div class="safe" data-fit>
    <!-- 시작 화면의 '초대 근무' 봉투 아이콘과 같은 모양 -->
    <div class="badge">
      <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#1B64DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg>
    </div>
    <h1>근무 <em>초대</em>가 왔어요</h1>
    <p>눌러서 조건을 확인하고 수락해 주세요</p>
  </div>
  <!-- 바닥 브랜드 줄은 잘려도 괜찮은 보조 정보(800×400 밖) -->
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 52 52" fill="none" aria-hidden="true">
      <rect x="4" y="4" width="28" height="28" rx="8" fill="#3182F6"/>
      <rect x="20" y="20" width="28" height="28" rx="8" fill="#191F28"/>
      <rect x="20" y="20" width="12" height="12" rx="3" fill="#FFFFFF"/>
    </svg>
    잇닿
  </div>
</body>
</html>
