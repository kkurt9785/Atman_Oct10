<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>잇닿 스토어 스크린샷</title>
<!-- 앱과 같은 Pretendard. 이 맥에는 Pretendard Variable 이 설치돼 있어 local() 로 먼저 잡힌다 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root {
    --blue: #1B64DA;      /* 앱 primary */
    --deep: #0D2E6B;      /* 기기 테두리 — 같은 파랑의 어두운 쪽 */
  }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body {
    position: relative;
    background: var(--blue);
    font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
  }
  /* 기기 뒤의 은은한 빛 — 무늬 없이 깊이만 */
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(1100px 900px at 50% 58%, rgba(255,255,255,0.16), rgba(255,255,255,0) 70%);
  }
  .mark { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); }
  .caption {
    position: absolute; left: 60px; right: 60px; top: 176px; overflow: hidden;
    margin: 0; text-align: center; color: #fff;
    font-weight: 800; font-size: 80px; line-height: 1.2; letter-spacing: -2.4px;
    white-space: nowrap;
  }
  .device {
    position: absolute; left: 130px; top: 368px;
    width: 820px; height: 1436px; box-sizing: border-box; padding: 14px;
    border-radius: 80px; background: var(--deep);
    box-shadow: 0 60px 120px rgba(4, 22, 64, 0.45), 0 0 0 2px rgba(255,255,255,0.10) inset;
  }
  .screen { width: 792px; height: 1408px; border-radius: 66px; overflow: hidden; background: #fff; }
  .screen img { display: block; width: 792px; height: 1408px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <!-- 잇닿 로고 '맞닿음'(components/brand/BrandMark.tsx · onPrimary 톤) -->
  <svg class="mark" width="60" height="60" viewBox="0 0 52 52" fill="none" aria-hidden="true">
    <rect x="4" y="4" width="28" height="28" rx="8" fill="rgba(255,255,255,0.45)"/>
    <rect x="20" y="20" width="28" height="28" rx="8" fill="#FFFFFF"/>
    <rect x="20" y="20" width="12" height="12" rx="3" fill="#1B64DA"/>
  </svg>
  <h1 class="caption" id="caption" data-fit></h1>
  <div class="device"><div class="screen"><img id="shot" alt=""></div></div>
<script>
  // render.mjs 가 ?shot=screens/xxx.png&caption=... 로 연다
  const params = new URLSearchParams(location.search);
  document.getElementById('caption').textContent = params.get('caption') ?? '캡션';
  document.getElementById('shot').src = params.get('shot') ?? 'screens/home.png';
</script>
</body>
</html>
