<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>잇닿 그래픽 이미지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  /* Play 그래픽 이미지 1024×500 — 사용자가 쓴 시작 화면 제목 한 메시지 + 로고 '맞닿음'을 크게 */
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    position: relative; background: #1B64DA;
    font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif;
    -webkit-font-smoothing: antialiased; word-break: keep-all; color: #fff;
  }
  .glow { position: absolute; inset: 0; background: radial-gradient(620px 520px at 78% 52%, rgba(255,255,255,0.16), rgba(255,255,255,0) 70%); }
  .copy { position: absolute; left: 84px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 26px; letter-spacing: -0.5px; opacity: 0.92; }
  h1 { margin: 26px 0 0; font-weight: 800; font-size: 60px; line-height: 1.22; letter-spacing: -2px; white-space: nowrap; }
  .mark { position: absolute; right: 70px; top: 50%; transform: translateY(-50%); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="copy">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 52 52" fill="none" aria-hidden="true">
        <rect x="4" y="4" width="28" height="28" rx="8" fill="rgba(255,255,255,0.45)"/>
        <rect x="20" y="20" width="28" height="28" rx="8" fill="#FFFFFF"/>
        <rect x="20" y="20" width="12" height="12" rx="3" fill="#1B64DA"/>
      </svg>
      잇닿 근무자
    </div>
    <h1 data-fit>내가 일 찾는 시대는 끝.<br>한 번 등록으로<br>원하는 일은 바로</h1>
  </div>
  <!-- 로고 '맞닿음'(BrandMark onPrimary 톤)을 크게 -->
  <svg class="mark" width="300" height="300" viewBox="0 0 52 52" fill="none" aria-hidden="true">
    <rect x="4" y="4" width="28" height="28" rx="8" fill="rgba(255,255,255,0.40)"/>
    <rect x="20" y="20" width="28" height="28" rx="8" fill="#FFFFFF"/>
    <rect x="20" y="20" width="12" height="12" rx="3" fill="#1B64DA"/>
  </svg>
</body>
</html>
