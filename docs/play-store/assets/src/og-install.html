<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>잇닿 설치 링크 미리보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  /* 카카오톡 링크 미리보기 1200×630 — 글자는 가운데 800×400(x 200~1000, y 115~515) 안에만 둔다 */
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; background: #1B64DA; color: #fff;
    font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif;
    -webkit-font-smoothing: antialiased; word-break: keep-all;
  }
  .glow { position: absolute; inset: 0; background: radial-gradient(700px 460px at 50% 50%, rgba(255,255,255,0.15), rgba(255,255,255,0) 72%); }
  .safe { position: absolute; left: 200px; top: 115px; width: 800px; height: 400px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  h1 { margin: 30px 0 0; font-weight: 800; font-size: 88px; line-height: 1.1; letter-spacing: -3px; white-space: nowrap; }
  .cta { margin-top: 34px; display: inline-flex; align-items: center; gap: 12px; height: 76px; padding: 0 38px;
    border-radius: 38px; background: #fff; color: #1B64DA; font-weight: 800; font-size: 34px; letter-spacing: -1px; white-space: nowrap; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="safe" data-fit>
    <svg width="84" height="84" viewBox="0 0 52 52" fill="none" aria-hidden="true">
      <rect x="4" y="4" width="28" height="28" rx="8" fill="rgba(255,255,255,0.45)"/>
      <rect x="20" y="20" width="28" height="28" rx="8" fill="#FFFFFF"/>
      <rect x="20" y="20" width="12" height="12" rx="3" fill="#1B64DA"/>
    </svg>
    <h1>잇닿 근무자 앱</h1>
    <div class="cta">눌러서 바로 설치해요
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1B64DA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12"/><path d="m6 11 6 6 6-6"/><path d="M5 20h14"/></svg>
    </div>
  </div>
</body>
</html>
