<!doctype html><html lang="ko"><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif;background:#fff;color:#191F28}
  .panel{width:340px;height:150px;position:relative;overflow:hidden;background:linear-gradient(180deg,#F4F6F9 0%,#E9EDF3 100%);border-radius:16px}
  .page{position:absolute;inset:14px 18px auto 18px;height:70px}
  .ghost{height:10px;border-radius:5px;background:#D7DCE4;margin-bottom:9px}
  .ghost.w1{width:62%}.ghost.w2{width:84%}.ghost.w3{width:48%}
  /* iOS 26 바닥 막대: 둥근 유리 알약 */
  .bar26{position:absolute;left:14px;right:14px;bottom:14px;height:52px;display:flex;align-items:center;gap:8px}
  .pill{flex:1;height:46px;border-radius:23px;background:rgba(255,255,255,.92);box-shadow:0 2px 10px rgba(0,0,0,.10),inset 0 0 0 1px rgba(0,0,0,.04);display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:600;color:#1C1C1E}
  .pill small{font-size:12px;color:#8E8E93;font-weight:500}
  .circle{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 2px 10px rgba(0,0,0,.10);display:flex;align-items:center;justify-content:center;font-size:22px;color:#1C1C1E;letter-spacing:1px}
  .hl{box-shadow:0 0 0 3px #1B64DA,0 2px 10px rgba(0,0,0,.10) !important}
  .tag{position:absolute;background:#1B64DA;color:#fff;font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap}
  .tag:after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-top-color:#1B64DA;border-bottom:0}
  .tag.up:after{bottom:auto;top:-6px;border:6px solid transparent;border-bottom-color:#1B64DA;border-top:0}
  .tag.right:after{left:auto;right:-6px;bottom:auto;top:50%;transform:translateY(-50%);border:6px solid transparent;border-left-color:#1B64DA;border-right:0}
  /* iOS 18 바닥 막대: 주소줄 + 5버튼 */
  .addr18{position:absolute;left:14px;right:14px;bottom:86px;height:34px;border-radius:12px;background:rgba(255,255,255,.95);box-shadow:0 1px 6px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#1C1C1E;gap:6px}
  .bar18{position:absolute;left:0;right:0;bottom:0;height:54px;background:rgba(255,255,255,.96);border-top:1px solid #E5E5EA;display:flex;align-items:center;justify-content:space-around;padding:0 10px}
  .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#1B64DA}
  .ic svg{width:24px;height:24px}
  .ic.dim{color:#C7C7CC}
  /* 공유 시트 */
  .sheet{position:absolute;left:14px;right:14px;top:16px;bottom:0;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -2px 14px rgba(0,0,0,.08);padding:10px 0 0}
  .grab{width:36px;height:4px;border-radius:2px;background:#D1D1D6;margin:0 auto 8px}
  .row{display:flex;align-items:center;justify-content:space-between;height:34px;padding:0 14px;font-size:14px;color:#1C1C1E;border-top:1px solid #F2F2F7}
  .row .i{width:22px;height:22px;color:#3C3C43;display:flex;align-items:center;justify-content:center}
  .row.on{background:#EBF3FF;color:#1B64DA;font-weight:800;box-shadow:inset 0 0 0 2px #1B64DA;border-radius:10px;margin:0 6px;padding:0 8px;border-top:0}
  .row.on .i{color:#1B64DA}
  .caption{position:absolute;left:0;right:0;bottom:0;height:22px;background:rgba(25,31,40,.0)}

  /* 안드로이드 크롬: 위쪽 주소줄 + 오른쪽 ⋮ */
  .chromebar{position:absolute;left:0;right:0;top:0;height:54px;background:#fff;border-bottom:1px solid #E5E5EA;display:flex;align-items:center;gap:10px;padding:0 12px}
  .omni{flex:1;height:36px;border-radius:18px;background:#F1F3F4;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;color:#202124}
  .kebab{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#202124;line-height:1}
  .page2{position:absolute;left:18px;right:18px;top:70px}
  /* 크롬 메뉴 */
  .menu{position:absolute;right:10px;top:8px;width:210px;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:6px 0}
  .mi{display:flex;align-items:center;gap:12px;height:34px;padding:0 14px;font-size:14px;color:#202124}
  .mi .i{width:20px;height:20px;color:#5F6368;display:flex;align-items:center;justify-content:center}
  .mi.on{background:#EBF3FF;color:#1B64DA;font-weight:800;box-shadow:inset 0 0 0 2px #1B64DA;border-radius:10px;margin:0 6px;padding:0 8px}
  .mi.on .i{color:#1B64DA}
  /* 삼성 인터넷: 아래 막대 오른쪽 ≡ */
  .sambar{position:absolute;left:0;right:0;bottom:0;height:54px;background:#fff;border-top:1px solid #E5E5EA;display:flex;align-items:center;justify-content:space-around;padding:0 10px}
  .grid{position:absolute;left:14px;right:14px;bottom:0;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -2px 14px rgba(0,0,0,.08);padding:14px 10px 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:#202124;padding:6px 2px;border-radius:12px}
  .tile .ic2{width:34px;height:34px;border-radius:10px;background:#F1F3F4;display:flex;align-items:center;justify-content:center;color:#5F6368}
  .tile.on{box-shadow:inset 0 0 0 2px #1B64DA;background:#EBF3FF;color:#1B64DA;font-weight:800}
  .tile.on .ic2{background:#fff;color:#1B64DA}
</style></head><body>

<!-- A. iOS 26 사파리: 주소창 오른쪽 ⋯ -->
<div class="panel" id="safari26">

  <div class="bar26">
    <div class="circle" style="font-size:20px">‹</div>
    <div class="pill"><span style="font-size:12px">🔒</span>itdot.co.kr</div>
    <div class="circle hl">⋯</div>
  </div>
  <div class="tag" style="right:12px;bottom:76px">여기 눌러요</div>
</div>

  <div class="bar18">
    <div class="ic dim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="ic dim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></div>
    <div class="ic hl" style="border-radius:50%"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9H6.5A1.5 1.5 0 0 0 5 10.5v8A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5v-8A1.5 1.5 0 0 0 17.5 9H16"/><path d="M12 14V3.5M8.5 7 12 3.5 15.5 7"/></svg></div>
    <div class="ic dim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H4z"/><path d="M20 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/></svg></div>
    <div class="ic dim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="13" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-1"/></svg></div>

  <div class="tag" style="left:50%;transform:translateX(-50%);bottom:58px">여기 눌러요</div>

<!-- D. 안드로이드 크롬: 오른쪽 위 ⋮ -->
<div class="panel" id="chrome-kebab">
  <div class="chromebar"><div class="omni"><span style="font-size:12px">🔒</span>itdot.co.kr</div><div class="kebab hl" style="border-radius:50%">⋮</div></div>
  <div class="page2"><div class="ghost w2"></div><div class="ghost w1"></div><div class="ghost w3"></div></div>

    <div class="mi"><span class="i"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4h12v16l-6-4-6 4z"/></svg></span>북마크</div>
    <div class="mi on"><span class="i"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M12 7.5v7M9.2 11.8 12 14.6l2.8-2.8"/></svg></span>앱 설치</div>

  </div>
  <div class="tag right" style="left:14px;top:86px;transform:none">여기 눌러요</div>
</div>

    <div class="ic hl" style="border-radius:50%"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg></div>
